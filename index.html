<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090308">
    <meta name="description" content="石广喆的个人主页">
    <title>石广喆</title>
    <style>
      :root {
        color-scheme: dark;
        --pointer-x: 0;
        --pointer-y: 0;
        --gold: #ffd476;
        --red: #8d102e;
        --black: #050306;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #050306;
        color: #fff;
        font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      }

      button {
        font: inherit;
      }

      .stage {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 103%, rgba(206, 114, 32, 0.28) 0, transparent 31%),
          radial-gradient(circle at 50% 48%, rgba(63, 14, 65, 0.55) 0, transparent 44%),
          linear-gradient(180deg, #110611 0%, #050306 67%, #17070d 100%);
      }

      .stage::before {
        position: absolute;
        z-index: -7;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
        content: "";
        opacity: 0.07;
        pointer-events: none;
      }

      .stage::after {
        position: absolute;
        z-index: -1;
        right: -10%;
        bottom: -16%;
        left: -10%;
        height: 38%;
        background:
          linear-gradient(90deg, transparent 0 16%, rgba(244, 172, 70, 0.12) 36%, rgba(255, 255, 255, 0.09) 50%, rgba(244, 172, 70, 0.12) 64%, transparent 84%),
          linear-gradient(180deg, rgba(255, 206, 112, 0.07), rgba(28, 3, 14, 0.96) 44%);
        border-top: 1px solid rgba(255, 221, 157, 0.26);
        box-shadow: 0 -28px 80px rgba(174, 38, 93, 0.16);
        content: "";
        perspective: 500px;
        transform: rotateX(58deg);
        transform-origin: center top;
      }

      .theatre-arch {
        position: absolute;
        z-index: 8;
        inset: 0;
        border: 2px solid rgba(255, 204, 106, 0.25);
        box-shadow:
          inset 0 0 28px rgba(255, 195, 77, 0.12),
          inset 0 0 0 9px rgba(24, 2, 9, 0.72);
        pointer-events: none;
      }

      .theatre-arch::before,
      .theatre-arch::after {
        position: absolute;
        top: 12px;
        width: 18px;
        height: 18px;
        border: 1px solid rgba(255, 213, 126, 0.64);
        content: "";
        transform: rotate(45deg);
      }

      .theatre-arch::before {
        left: 12px;
      }

      .theatre-arch::after {
        right: 12px;
      }

      .curtain {
        position: absolute;
        z-index: 6;
        top: -4%;
        bottom: -8%;
        width: 26%;
        background:
          linear-gradient(90deg, rgba(25, 0, 7, 0.98), rgba(144, 10, 47, 0.94) 25%, rgba(47, 1, 15, 0.98) 48%, rgba(158, 13, 53, 0.93) 72%, rgba(34, 1, 11, 0.98)),
          #641027;
        box-shadow: inset 0 0 26px #180006, 0 0 42px rgba(0, 0, 0, 0.78);
        opacity: 0;
        animation: curtainReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .curtain::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, transparent, #f9cc6a 11%, #805217 62%, transparent);
        box-shadow: 0 0 16px rgba(255, 198, 81, 0.38);
        content: "";
      }

      .curtain-left {
        left: 0;
        clip-path: polygon(0 0, 100% 0, 70% 17%, 89% 42%, 58% 72%, 76% 100%, 0 100%);
        transform-origin: left center;
      }

      .curtain-left::after {
        right: 25%;
      }

      .curtain-right {
        right: 0;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 24% 100%, 42% 72%, 11% 42%, 30% 17%);
        transform-origin: right center;
      }

      .curtain-right::after {
        left: 25%;
      }

      .spotlight {
        position: absolute;
        z-index: -5;
        top: -25%;
        width: 34%;
        height: 105%;
        background: linear-gradient(180deg, rgba(255, 239, 191, 0.25), rgba(234, 179, 255, 0.06) 48%, transparent 84%);
        filter: blur(9px);
        mix-blend-mode: screen;
        opacity: 0.6;
        pointer-events: none;
      }

      .spotlight-left {
        left: 4%;
        transform: translate(calc(var(--pointer-x) * -7px), calc(var(--pointer-y) * -4px)) rotate(-20deg);
        transform-origin: top center;
      }

      .spotlight-right {
        right: 4%;
        transform: translate(calc(var(--pointer-x) * 7px), calc(var(--pointer-y) * -4px)) rotate(20deg);
        transform-origin: top center;
      }

      .aurora {
        position: absolute;
        z-index: -4;
        top: 18%;
        left: 50%;
        width: 72%;
        height: 46%;
        border-radius: 50%;
        background:
          conic-gradient(from 225deg at 50% 50%, transparent, rgba(0, 244, 255, 0.54), rgba(236, 61, 255, 0.52), rgba(255, 211, 64, 0.32), transparent 72%);
        filter: blur(42px) saturate(1.35);
        mix-blend-mode: screen;
        opacity: 0.42;
        pointer-events: none;
        transform: translate3d(calc(-50% + var(--pointer-x) * 9px), calc(var(--pointer-y) * 6px), 0) rotate(-7deg);
        animation: auroraShift 10s ease-in-out infinite alternate;
      }

      .stars {
        position: absolute;
        z-index: -2;
        inset: 7% 16% 11%;
        pointer-events: none;
      }

      .star {
        position: absolute;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: var(--color);
        box-shadow: 0 0 11px 2px var(--color);
        opacity: var(--opacity);
        animation: twinkle var(--speed) ease-in-out infinite alternate;
      }

      .hero {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        place-items: center;
        width: min(74rem, 82vw);
        height: 100vh;
        height: 100svh;
        margin: 0 auto;
        padding: 6vh 0 2.5vh;
        transform: translate3d(calc(var(--pointer-x) * 2px), calc(var(--pointer-y) * 1px), 0);
      }

      h1 {
        position: relative;
        z-index: 3;
        margin: 0;
        background: linear-gradient(90deg, #ff526d, #ffd45c, #54f8d2, #66caff, #dc6dff, #ff526d);
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 8.5rem;
        font-weight: 900;
        line-height: 1.04;
        letter-spacing: 0;
        text-align: center;
        filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.72)) drop-shadow(0 0 26px rgba(233, 65, 255, 0.62));
        opacity: 0;
        transform: translateY(26px);
        animation:
          titleReveal 1s 0.35s cubic-bezier(0.2, 0.85, 0.25, 1) forwards,
          rainbowFlow 6s 1.35s linear infinite;
      }

      h1::before,
      h1::after {
        position: absolute;
        top: 50%;
        width: 16vw;
        max-width: 190px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 211, 118, 0.88));
        box-shadow: 0 0 11px #ffb43a;
        content: "";
      }

      h1::before {
        right: calc(100% + 28px);
      }

      h1::after {
        left: calc(100% + 28px);
        transform: rotate(180deg);
      }

      .violin-zone {
        position: relative;
        display: grid;
        place-items: center;
        align-self: stretch;
        width: 100%;
        min-height: 0;
        perspective: 1000px;
      }

      .violin-zone::before {
        position: absolute;
        bottom: 3%;
        width: 330px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 199, 93, 0.35), rgba(232, 61, 255, 0.13) 43%, transparent 73%);
        filter: blur(10px);
        content: "";
        transform: translateX(calc(var(--pointer-x) * -3px));
      }

      .violin-stage {
        position: relative;
        display: grid;
        width: 240px;
        height: min(58vh, 560px);
        min-height: 360px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        outline: none;
        opacity: 0;
        transform: translate3d(calc(var(--pointer-x) * 7px), calc(34px + var(--pointer-y) * 5px), 0) rotateY(calc(var(--pointer-x) * 1.4deg));
        animation:
          violinReveal 1.2s 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards,
          violinFloat 4s 1.95s ease-in-out infinite alternate;
      }

      .violin-stage::before,
      .violin-stage::after {
        position: absolute;
        pointer-events: none;
        content: "";
      }

      .violin-stage::before {
        z-index: -1;
        inset: 7% -22%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 183, 54, 0.35), rgba(237, 65, 255, 0.19) 38%, rgba(55, 219, 255, 0.12) 55%, transparent 73%);
        filter: blur(22px);
        opacity: 0.88;
        transition: opacity 250ms ease, transform 250ms ease;
      }

      .violin-stage::after {
        z-index: 2;
        top: 8%;
        bottom: 8%;
        left: -45%;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
        filter: blur(4px);
        mix-blend-mode: screen;
        opacity: 0.45;
        transform: skewX(-18deg);
        animation: sheen 4.8s 2.2s ease-in-out infinite;
      }

      .violin-stage:hover::before,
      .violin-stage:focus-visible::before,
      .violin-stage.is-playing::before {
        opacity: 1;
        transform: scale(1.12);
      }

      .violin-stage:focus-visible {
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(255, 233, 182, 0.9), 0 0 24px rgba(92, 232, 255, 0.75);
      }

      .violin-stage img {
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter:
          sepia(0.18)
          saturate(1.35)
          contrast(1.06)
          drop-shadow(0 0 2px rgba(255, 243, 199, 0.95))
          drop-shadow(0 0 9px rgba(255, 166, 43, 0.8))
          drop-shadow(0 0 24px rgba(221, 55, 255, 0.48));
        transition: filter 250ms ease, transform 250ms ease;
      }

      .violin-stage:hover img,
      .violin-stage:focus-visible img,
      .violin-stage.is-playing img {
        filter:
          sepia(0.28)
          saturate(1.6)
          contrast(1.08)
          drop-shadow(0 0 3px #fff9db)
          drop-shadow(0 0 14px #ffbd42)
          drop-shadow(0 0 33px #d740ff)
          drop-shadow(0 0 47px #31d9ff);
        transform: scale(1.025);
      }

      .sound-wave {
        position: absolute;
        z-index: 0;
        top: 50%;
        left: 50%;
        width: 140px;
        height: 240px;
        border: 2px solid var(--wave-color, #65edff);
        border-radius: 50%;
        box-shadow: inset 0 0 18px var(--wave-color, #65edff), 0 0 18px var(--wave-color, #65edff);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.45);
        animation: soundWave 950ms cubic-bezier(0.16, 0.78, 0.26, 1) forwards;
      }

      .sound-wave:nth-of-type(2) {
        animation-delay: 90ms;
      }

      .sound-wave:nth-of-type(3) {
        animation-delay: 180ms;
      }

      @keyframes curtainReveal {
        from {
          opacity: 0;
          transform: scaleX(1.18);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes titleReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes rainbowFlow {
        to {
          background-position: 240% 0;
        }
      }

      @keyframes auroraShift {
        from {
          opacity: 0.32;
          filter: blur(42px) saturate(1.2) hue-rotate(0deg);
        }
        to {
          opacity: 0.52;
          filter: blur(48px) saturate(1.5) hue-rotate(24deg);
        }
      }

      @keyframes twinkle {
        from {
          opacity: calc(var(--opacity) * 0.35);
          transform: scale(0.7);
        }
        to {
          opacity: var(--opacity);
          transform: scale(1.25);
        }
      }

      @keyframes violinReveal {
        to {
          opacity: 1;
          transform: translate3d(calc(var(--pointer-x) * 7px), calc(var(--pointer-y) * 5px), 0) rotateY(calc(var(--pointer-x) * 1.4deg));
        }
      }

      @keyframes violinFloat {
        from {
          margin-top: -4px;
        }
        to {
          margin-top: 8px;
        }
      }

      @keyframes sheen {
        0%, 16% {
          left: -45%;
          opacity: 0;
        }
        31% {
          opacity: 0.62;
        }
        48%, 100% {
          left: 118%;
          opacity: 0;
        }
      }

      @keyframes soundWave {
        0% {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(0.45);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(2.8);
        }
      }

      @media (max-width: 900px) {
        .hero {
          width: 78vw;
          padding-top: 8vh;
        }

        h1 {
          font-size: 6.4rem;
        }

        .curtain {
          width: 31%;
        }

        .violin-stage {
          width: 215px;
          height: min(57vh, 520px);
        }
      }

      @media (max-width: 600px) {
        .hero {
          width: 76vw;
          padding: 9vh 0 3vh;
        }

        h1 {
          font-size: 4rem;
          line-height: 1.08;
        }

        h1::before,
        h1::after {
          display: none;
        }

        .curtain {
          width: 29%;
          opacity: 0.9;
        }

        .curtain-left {
          clip-path: polygon(0 0, 100% 0, 60% 20%, 81% 48%, 52% 76%, 68% 100%, 0 100%);
        }

        .curtain-right {
          clip-path: polygon(0 0, 100% 0, 100% 100%, 32% 100%, 48% 76%, 19% 48%, 40% 20%);
        }

        .spotlight {
          width: 52%;
        }

        .aurora {
          top: 21%;
          width: 105%;
        }

        .violin-stage {
          width: 185px;
          height: min(58vh, 475px);
          min-height: 310px;
        }

        .violin-zone::before {
          width: 240px;
        }
      }

      @media (max-height: 700px) {
        .hero {
          padding-top: 5vh;
        }

        h1 {
          font-size: 4.6rem;
        }

        .violin-stage {
          width: 155px;
          height: 67vh;
          min-height: 260px;
        }
      }

      @media (max-width: 420px) {
        h1 {
          font-size: 3.5rem;
        }

        .violin-stage {
          width: 165px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }

        .hero,
        .spotlight,
        .aurora,
        .violin-stage {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="theatre-arch" aria-hidden="true"></div>
      <div class="curtain curtain-left" aria-hidden="true"></div>
      <div class="curtain curtain-right" aria-hidden="true"></div>
      <div class="spotlight spotlight-left" aria-hidden="true"></div>
      <div class="spotlight spotlight-right" aria-hidden="true"></div>
      <div class="aurora" aria-hidden="true"></div>
      <div class="stars" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="artist-name">
        <h1 id="artist-name">石广喆</h1>

        <div class="violin-zone">
          <button class="violin-stage" type="button" aria-label="奏响小提琴">
            <img src="assets/violin.png" alt="鎏金霓虹小提琴">
          </button>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const stage = document.querySelector('.stage');
      const violin = document.querySelector('.violin-stage');
      const stars = document.querySelector('.stars');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const starColors = ['#fff3b6', '#66efff', '#ff73e8', '#ffb44d'];

      for (let index = 0; index < 46; index += 1) {
        const star = document.createElement('i');
        star.className = 'star';
        star.style.left = `${(index * 37 + 11) % 100}%`;
        star.style.top = `${(index * 53 + 7) % 100}%`;
        star.style.setProperty('--size', `${1 + (index % 3)}px`);
        star.style.setProperty('--opacity', `${0.28 + (index % 5) * 0.13}`);
        star.style.setProperty('--speed', `${1.4 + (index % 7) * 0.34}s`);
        star.style.setProperty('--color', starColors[index % starColors.length]);
        stars.append(star);
      }

      stage.addEventListener('pointermove', (event) => {
        if (reducedMotion.matches) return;

        const x = (event.clientX / window.innerWidth - 0.5) * 2;
        const y = (event.clientY / window.innerHeight - 0.5) * 2;
        root.style.setProperty('--pointer-x', x.toFixed(3));
        root.style.setProperty('--pointer-y', y.toFixed(3));
      });

      stage.addEventListener('pointerleave', () => {
        root.style.setProperty('--pointer-x', 0);
        root.style.setProperty('--pointer-y', 0);
      });

      function triggerResonance(origin) {
        origin.querySelectorAll('.sound-wave').forEach((wave) => wave.remove());
        const waveColors = ['#63efff', '#ff65e7', '#ffd05f'];

        waveColors.forEach((color) => {
          const wave = document.createElement('span');
          wave.className = 'sound-wave';
          wave.style.setProperty('--wave-color', color);
          origin.append(wave);
        });

        origin.classList.remove('is-playing');
        void origin.offsetWidth;
        origin.classList.add('is-playing');

        window.setTimeout(() => {
          origin.classList.remove('is-playing');
          origin.querySelectorAll('.sound-wave').forEach((wave) => wave.remove());
        }, reducedMotion.matches ? 50 : 1250);
      }

      violin.addEventListener('click', () => triggerResonance(violin));
      violin.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          triggerResonance(violin);
        }
      });
    </script>
  </body>
</html>
