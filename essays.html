<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f0eb">
    <meta name="description" content="Andy SGZ 的杂谈。">
    <title>杂谈 | Andy SGZ</title>
    <link rel="stylesheet" href="assets/style.css">
    <!-- 明暗主题：必须同步执行（不加 defer），否则首屏会先闪一下浅色 -->
    <script src="scripts/theme.js"></script>
    <script src="scripts/site-data.js" defer></script>
    <script src="scripts/render-sections.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-nav" id="top">
      <div class="site-nav__inner">
        <div class="site-nav__brand">
          <a class="wordmark" href="index.html">Andy SGZ</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
            <span class="nav-zh" data-theme-label-zh>暗色</span>
            <span class="nav-en" data-theme-label-en>Dark</span>
          </button>
        </div>
        <nav class="site-nav__links" aria-label="主导航">
          <a href="index.html"><span class="nav-zh">首页</span><span class="nav-en">Home</span></a>
          <a href="about.html"><span class="nav-zh">关于</span><span class="nav-en">About</span></a>
          <a href="essays.html" aria-current="page"><span class="nav-zh">杂谈</span><span class="nav-en">Essays</span></a>
          <a href="works.html"><span class="nav-zh">作品</span><span class="nav-en">Works</span></a>
          <a href="practice.html"><span class="nav-zh">练琴</span><span class="nav-en">Practice</span></a>
          <a href="Jary/index.html"><span class="nav-zh">《Jary行为研究》</span><span class="nav-en">JARY Behavior Research</span></a>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="page-header">
        <div class="container">
          <h1 class="page-header__title">杂谈</h1>
          <p class="page-header__lead">
            按时间倒序排列。
          </p>
        </div>
      </div>

      <section class="section" aria-labelledby="all-essays-heading">
        <div class="container">
          <h2 class="sr-only" id="all-essays-heading">全部杂谈</h2>
          <!-- 分类按钮由 scripts/render-sections.js 依据条目的 tag 自动生成。
               以后想加新分类，只要在 site-data.js 里给条目写新的 tag，
               按钮会自己出现，这个文件不用动。 -->
          <div class="filter-bar" data-essay-filter role="group" aria-label="按分类筛选"></div>
          <p class="filter-status" data-essay-status role="status" aria-live="polite"></p>
          <!-- 不加 data-limit：显示全部。条目内容来自 scripts/site-data.js -->
          <ul class="entry-list" data-essays-list></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <span>&copy; 2026 Andy SGZ</span>
        <a href="#top">回到顶部 &uarr;</a>
      </div>
    </footer>
  </body>
</html>
