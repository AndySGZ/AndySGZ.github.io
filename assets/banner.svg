<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img"
     aria-label="野兽派几何海报：厚黑外框里，黄底上一轮低垂的红色圆日，两座青与珊瑚色的三角远山，山脚横着三道薄荷色薄雾">
  <!-- 画风跟着站点换成了俏皮野兽派：平涂纯色、厚黑描边、无渐变、无圆角。
       构图还是「远山、薄雾与低垂的太阳」那个意思，只是把柔光换成了色块。 -->
  <rect width="900" height="1200" fill="#ffe66d"/>

  <!-- 太阳先画，山后画，于是它正好沉在山脊后面 -->
  <circle cx="620" cy="400" r="160" fill="#ff6b6b" stroke="#000000" stroke-width="16"/>

  <polygon points="0,780 300,420 620,780" fill="#4ecdc4" stroke="#000000"
           stroke-width="16" stroke-linejoin="round"/>
  <polygon points="340,780 660,500 900,780" fill="#f38181" stroke="#000000"
           stroke-width="16" stroke-linejoin="round"/>

  <!-- 薄雾：三道横条，压在山的下半截上 -->
  <rect x="40" y="830" width="820" height="64" fill="#95e1d3" stroke="#000000" stroke-width="16"/>
  <rect x="40" y="940" width="820" height="64" fill="#95e1d3" stroke="#000000" stroke-width="16"/>
  <rect x="40" y="1050" width="820" height="64" fill="#95e1d3" stroke="#000000" stroke-width="16"/>

  <rect x="14" y="14" width="872" height="1172" fill="none" stroke="#000000" stroke-width="28"/>
</svg>
